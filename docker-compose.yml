# docker compose --env-file .env up --build --scale app=3
services:
  app:                         # backend: N identical Next.js instances
    build: { context: ., args: { CDN_URL: "${CDN_URL:-http://localhost:8081}" } }
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@pgbouncer:6432/${DB_NAME}
      REDIS_URL: redis://redis:6379
    depends_on: [pgbouncer, redis]
    expose: ["3000"]
  lb:                          # load balancer between frontend and backend
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./infra/lb.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  cdn:                         # static-file CDN (edge cache in front of the LB)
    image: nginx:alpine
    ports: ["8081:80"]
    volumes: ["./infra/cdn.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [lb]
  pgbouncer:                   # connection pooler between backend and database
    image: edoburu/pgbouncer
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
  redis:                       # cache
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
